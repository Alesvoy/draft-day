  POSITIONS.forEach(pos=>TIERS[pos].forEach(t=>{
    if(t.tier==='late')return; // late pool: hook cards cover the names worth knowing
    const names=t.players.map(p=>p.name).join(', '),last=t.players[t.players.length-1];
    out.push(card('Tier recall',`Name the tier-${t.tier} ${pos}${t.players.length>1?'s':''}.`,names));
    if(t.players.length>1)out.push(card('Boundary',`Who is the LAST ${pos} in tier ${t.tier}?`,`${last.name}. That is the tier cliff.`));
  }));
  // same-position pairs only across a tier boundary: inside a tier, order is noise
  POSITIONS.forEach(pos=>{
    const ts=TIERS[pos];
    for(let i=0;i<ts.length-1&&ts[i+1].tier!=='late';i++){
      const a=ts[i].players.at(-1),b=ts[i+1].players[0];
      out.push(card('Who goes earlier?',`${a.name} or ${b.name}?`,`${a.name} — he is the tier-${ts[i].tier} cliff; ${b.name} opens tier ${ts[i+1].tier}.`));
    }
  });
  const byAdp=draftable.filter(p=>p.adp).slice().sort((a,b)=>a.adp-b.adp);
  for(let i=0;i<byAdp.length-1;i+=7){const a=byAdp[i],b=byAdp.slice(i+1,i+6).find(x=>x.pos!==a.pos);if(!b)continue;const winner=a.ecr<=b.ecr?a:b;out.push(card('Who goes earlier?',`${a.name} or ${b.name}?`,`${winner.name}. ${a.name}: ECR ${a.ecr}, ADP ${a.adp}. ${b.name}: ECR ${b.ecr}, ADP ${b.adp}.`))}
  draftable.filter(p=>hookText(p)).forEach(p=>out.push(card('Hook recall',`What's the hook on ${p.name}?`,hookText(p))));
  for(let round=1;round<=ROUNDS;round++){
    const p=planFor(round);
    out.push(card('Plan recall',`Your pick ${pickLabel(round)}: what's the plan?`,`${p.plan}. Fallback: ${p.fallback}.`));
  }
  return out;
}
let deck=[],queue=[],state,lapsed=new Set();
function startSession(increment=true){
  deck=cards();state=read('study-leitner',{session:0,boxes:{}});if(increment)state.session++;lapsed=new Set();
  deck.forEach(c=>{if(!state.boxes[c.id])state.boxes[c.id]=1});write('study-leitner',state);
  queue=deck.filter(c=>state.boxes[c.id]===1||(state.boxes[c.id]===2&&state.session%2===0)||(state.boxes[c.id]===3&&state.session%4===0));
  // tier knowledge first: short sessions still hit the highest-value cards
  const prio={'Boundary':0,'Tier recall':1,'Who goes earlier?':2,'Plan recall':3,'Hook recall':4};
  queue.sort((a,b)=>prio[a.type]-prio[b.type]||hash(a.id+state.session).localeCompare(hash(b.id+state.session)));renderDrill();
}
function progress(){const counts=[1,2,3].map(box=>deck.filter(c=>state.boxes[c.id]===box).length);return {counts,mastered:counts[2],total:deck.length}}
function renderDrill(){
  const p=progress(),c=queue[0],left=queue.length,relearning=queue.filter(x=>lapsed.has(x.id)).length;
  if(!c){$('#view').innerHTML=`<section class="drills"><header class="drill-head"><h1>Session complete.</h1><div class="progress"><span><strong>${p.mastered}/${p.total}</strong> cards in box 3</span><span>Boxes: ${p.counts.join(' / ')}</span></div></header><div class="session-done"><div><h2>Good work.</h2><button id="again">Start another session</button></div></div></section>`;$('#again').onclick=()=>startSession(true);return}
  $('#view').innerHTML=`<section class="drills"><header class="drill-head"><h1>Recall before reveal.</h1><div class="progress"><span><strong>${p.mastered}/${p.total}</strong> cards in box 3</span><span>Box 1 / 2 / 3: ${p.counts.join(' / ')}</span><span>${left} left${relearning?` · ${relearning} relearning`:''}</span></div></header><article class="flashcard"><div class="card-meta"><span>${esc(c.type)}</span><span>Box ${state.boxes[c.id]}</span></div><div class="prompt"><div><h2>${esc(c.question)}</h2><div class="answer" aria-live="polite">${esc(c.answer)}</div></div></div><div class="card-actions"><button class="reveal">Reveal answer</button><button class="score missed">Missed</button><button class="score got">Got it</button></div></article><div class="hint">Keyboard: space reveals / 1 missed / 2 got it</div></section>`;
  $('.reveal').onclick=reveal;$('.missed').onclick=()=>score(false);$('.got').onclick=()=>score(true);
}
function reveal(){$('.flashcard')?.classList.add('revealed')}
function score(got){const c=queue.shift();if(got){if(!lapsed.has(c.id))state.boxes[c.id]=Math.min(3,state.boxes[c.id]+1)}else{state.boxes[c.id]=1;lapsed.add(c.id);queue.splice(Math.min(5,queue.length),0,c)}write('study-leitner',state);renderDrill()}
function show(next){
  view=next;location.hash=next==='drills'?'drills':'';$$('.tab').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.view===next)));
  if(next==='brain')$('#view').innerHTML=brain();else startSession(true);
}
function init(){
  const select=$('#seat');select.innerHTML=Array.from({length:TEAMS},(_,i)=>`<option value="${i+1}">${i+1}</option>`).join('');select.value=seat;
  select.onchange=()=>{seat=+select.value;write('study-seat',seat);if(view==='brain')$('#view').innerHTML=brain();else startSession(false)};
  $$('.tab').forEach(b=>b.onclick=()=>show(b.dataset.view));$('#print').onclick=()=>{if(view!=='brain')show('brain');setTimeout(()=>print(),0)};
  show(view);
}
document.addEventListener('keydown',e=>{if(view!=='drills'||/SELECT|INPUT/.test(document.activeElement?.tagName))return;if(e.code==='Space'){e.preventDefault();reveal()}if(e.key==='1'&&$('.flashcard.revealed'))score(false);if(e.key==='2'&&$('.flashcard.revealed'))score(true)});
init();
</script>

if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('../sw.js').catch(function(){});});}
