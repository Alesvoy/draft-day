<body>
<nav aria-label="Study mode navigation">
  <div class="brand">Draft Study <small>14-team standard</small></div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-view="brain">Brain Sheet</button>
    <button class="tab" role="tab" data-view="drills">Drills</button>
  </div>
  <label class="seat-control">Seat <select id="seat" aria-label="Draft seat"></select></label>
  <button class="print-btn" id="print">Print sheet</button>
</nav>
<main id="view"></main>
<script>
const BOARD=__BOARD_JSON__;
const PROFILES=__PROFILES_JSON__; // {name:{situation,pros,cons,bottom_line,stance,cl,note}} -- guide leans folded in at build time
const TEAMS=14,ROUNDS=14,CUTOFF=TEAMS*ROUNDS,POSITIONS=['QB','RB','WR','TE'];
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[—–]/g,'-').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const read=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};
const write=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
let seat=Math.min(TEAMS,Math.max(1,+read('study-seat',1)||1)), view=location.hash==='#drills'?'drills':'brain';
const draftable=BOARD.players.filter(p=>POSITIONS.includes(p.pos)&&p.ecr<=CUTOFF&&p.pos_tier!=null).sort((a,b)=>a.ecr-b.ecr);

function overall(round,s=seat){return(round-1)*TEAMS+(round%2?s:TEAMS-s+1)}
function slot(round,s=seat){return round%2?s:TEAMS-s+1}
function pickLabel(round,s=seat){return `${round}.${String(slot(round,s)).padStart(2,'0')}`}
const LATE_PICK=TEAMS*10; // past round 10, exact tier identity stops mattering
function tierGroups(pos){
  const map=new Map();
  draftable.filter(p=>p.pos===pos).forEach(p=>{if(!map.has(p.pos_tier))map.set(p.pos_tier,[]);map.get(p.pos_tier).push(p)});
  const groups=[...map].sort((a,b)=>a[0]-b[0]).map(([tier,players])=>({pos,tier,players}));
  const cut=groups.findIndex(g=>Math.min(...g.players.map(p=>p.adp||p.ecr))>LATE_PICK);
  if(cut>0)groups.splice(cut,groups.length,{pos,tier:'late',players:groups.slice(cut).flatMap(g=>g.players)});
  return groups.map(g=>({...g,adp:Math.max(...g.players.map(p=>p.adp||p.ecr)),vor:Math.max(...g.players.map(p=>p.vor??-999))}));
}
const tLabel=t=>t.tier==='late'?'late':`t${t.tier}`;
const TIERS=Object.fromEntries(POSITIONS.map(p=>[p,tierGroups(p)]));
// Memorization bands. Reps are the scarce resource, so spend precision where
// picks are actually decided: rounds 1-7 by name, 8+ by plan. In a 14-teamer
// the early tiers are gone by round 5, so rounds 4-7 need names too.
// Bands run per tier, not per player, so a tier straddling a boundary is learned
// whole. That already carries the late TEs/QBs who beat replacement (Kelce,
// Goedert, Andrews); the vor clause is a safety net for boards where it doesn't.
const BAND_A_END=TEAMS*3, BAND_B_END=TEAMS*7;
const bandOf=t=>{const p=t.players[0];
  return p.ecr<=BAND_A_END?'A':(p.ecr<=BAND_B_END||(p.vor??0)>0)?'B':'C'};
// A tier boundary is a real cliff only where the points gap beat the break
// threshold. natural_break_tiers also cuts every 6 players to keep tiers
// readable; those cuts are bookkeeping, not panic triggers, so they earn no card.
const TIER_SENS=0.75;
const CLIFF_MIN=Object.fromEntries(POSITIONS.map(pos=>{
  const v=BOARD.players.filter(p=>p.pos===pos&&p.proj_pts!=null).map(p=>p.proj_pts).sort((a,b)=>b-a);
  const g=v.slice(0,-1).map((x,i)=>x-v[i+1]);
  if(!g.length)return[pos,Infinity];
  const m=g.reduce((s,x)=>s+x,0)/g.length;
  return[pos,m+TIER_SENS*Math.sqrt(g.reduce((s,x)=>s+(x-m)**2,0)/g.length)];
}));
// tiers are listed in ECR order but were cut in projection order, so the
// boundary gap is floor(this tier) - ceiling(the next one), not last minus first
const pts=(ps,f)=>f(...ps.map(p=>p.proj_pts).filter(v=>v!=null));
const isCliff=(pos,t,next)=>!next||(pts(t.players,Math.min)-pts(next.players,Math.max))>CLIFF_MIN[pos];
const SHORT={'REC-BACK':'pass-catcher','COMMITTEE':'committee upside','KONAMI':'rushing floor','POCKET':'pocket passer','ELITE-TE':'elite TE','MOBILE-QB':'QB steals rushes','GOOD-OFF':'strong offense','WEAK-OFF':'weak offense','LOW-COMP':'clear targets','CROWDED':'crowded room','ROOKIE':'rookie ceiling'};
function shortTarget(name,player){
  const useful=s=>(s||'').split(' ').filter(x=>!['Jr.','Sr.','II','III','IV'].includes(x)),target=useful(name),own=useful(player);
  return target.at(-1)===own.at(-1)?target[0]:target.at(-1)||'?';
}
function hooks(p){
  const tags=[...(p.strategy||[]),...(p.context||[])], out=[];
  for(const tag of tags){
    if(!BOARD.meta.tag_legend?.[tag]||out.length===2)continue;
    const text=tag==='HANDCUFF'?`handcuff→${shortTarget(p.handcuff_to,p.name)}`:SHORT[tag];
    if(text&&!out.some(x=>x.text===text))out.push({text,title:BOARD.meta.tag_legend[tag]});
  }
  return out;
}
function hookText(p){return hooks(p).map(x=>x.text).join(', ')}
function playerHtml(p,last){
  const hs=hooks(p),title=hs.map(x=>x.title).join(' | ');
  return `<span class="player ${last?'boundary':''}"${title?` title="${esc(title)}"`:''}>${esc(p.name)}${hs.length?` <span class="hook">(${esc(hs.map(x=>x.text).join(', '))})</span>`:''}</span>`;
}
function currentTier(pos,pick){return TIERS[pos].find(t=>t.adp>=pick)||null}
function tierFlavor(t,round){
  if(!t)return null;const tags=new Set(t.players.flatMap(p=>p.strategy||[]));
  if(t.pos==='QB'&&tags.has('KONAMI'))return `KONAMI QB ${tLabel(t)}`;
  if(t.pos==='RB'&&round>=10&&tags.has('HANDCUFF'))return `handcuff RB ${tLabel(t)}`;
  if(t.pos==='RB'&&tags.has('REC-BACK'))return `pass-catching RB ${tLabel(t)}`;
  if(t.pos==='TE'&&tags.has('ELITE-TE'))return `elite TE ${tLabel(t)}`;
  return `${t.pos} ${tLabel(t)}`;
}
function planFor(round,s=seat){
  const pick=overall(round,s), available=POSITIONS.map(pos=>currentTier(pos,pick)).filter(Boolean);
  const scored=available.map(t=>{
    const tags=new Set(t.players.flatMap(p=>p.strategy||[]));let score=t.vor;
    if(t.pos==='RB'&&round<=4)score+=24;
    if(t.pos==='RB'&&(tags.has('REC-BACK')||tags.has('COMMITTEE')))score+=6;
    if(t.pos==='QB'&&tags.has('KONAMI'))score+=10;
    if(t.pos==='QB'&&tags.has('POCKET'))score-=8;
    if(t.pos==='TE'&&t.tier!==1&&round>=6&&round<=10)score-=1000;
    return {t,score};
  }).sort((a,b)=>b.score-a.score);
  const top=scored.slice(0,2).map(x=>tierFlavor(x.t,round));
  let fallback=scored.slice(2).find(x=>x.t.pos==='QB'&&x.t.players.some(p=>(p.strategy||[]).includes('KONAMI')))||scored[2];
  if(round>=13){
    const upside=scored.filter(x=>['RB','WR'].includes(x.t.pos)).slice(0,2).map(x=>tierFlavor(x.t,round));
    return {pick,available,plan:`Best late upside: ${upside.join(' / ')||'RB / WR'}`,fallback:'K/DST only if required'};
  }
  return {pick,available,plan:`Best available: ${top.join(' / ')||'highest VOR tier'}`,fallback:fallback?tierFlavor(fallback.t,round):'wait on QB/TE'};
}
function strategyRules(){
  const n=BOARD.meta.strategy_notes||{};
  return [
    n.RB&&'Anchor an RB early. Scarcity is real in 14-team standard.',
    n.TE&&'Elite TE or wait. Suppress the round 6-10 dead zone.',
    n.QB&&'Prefer a mobile QB with a rushing floor over a pocket passer.',
    n.WR&&'WR is deepest. After an anchor RB, chase target share and ceiling.',
    (n.K||n.DST)&&'Late rounds: handcuffs and rookies first. K/DST only at the end.'
  ].filter(Boolean);
}
// --- pick cards ------------------------------------------------------------
// Availability: the chance a player is still on the board at overall pick N.
// ADP is the market's median, so treat the draft slot he actually goes at as
// normal around it; sigma widens with ADP because late prices are noisy.
// No ADP at all means nobody is drafting him -- he is free whenever you want.
const erf=x=>{const s=x<0?-1:1,a=Math.abs(x),t=1/(1+.3275911*a);
  return s*(1-((((1.061405429*t-1.453152027)*t+1.421413741)*t-.284496736)*t+.254829592)*t*Math.exp(-a*a))};
function pAvail(adp,pick){return !adp||adp>=999?.99:1-.5*(1+erf((pick-adp)/(Math.max(6,.18*adp)*Math.SQRT2)))}
const pct5=v=>Math.round(v*20)*5; // one rounding: the bar, the % and the stamp all read the same number
const STAMPS=[[85,'THERE'],[60,'LIKELY'],[35,'COIN FLIP'],[0,'IF HE SLIDES']];
const stampFor=(adp,v)=>adp?STAMPS.find(s=>v>=s[0])[1]:'FREE';
const MAX_TARGETS=5,MAX_AVOIDS=3,PROFILED=p=>PROFILES[p.name];
// Who to want and who to refuse at this exact pick. Both sides require a
// profile -- a row you cannot open is just noise on a sheet you cannot search.
function planRows(pick,round){
  const has=(p,t)=>(p.context||[]).includes('LRDG-'+t);
  const mkt=p=>p.adp||p.ecr, av=p=>pAvail(p.adp,pick), vor=p=>p.vor??-999;
  const cl=p=>(PROFILES[p.name].cl??5)/10; // unflagged players carry the guide's midpoint
  const pool=draftable.filter(PROFILED);
  const flagged=pool.filter(p=>(has(p,'TARGET')||has(p,'DART'))&&mkt(p)<=pick+24);
  // the guide is a LATE-round guide, so rounds 1-3 have almost no flags: there
  // the card is a value card -- best board left that the market might leave you
  const early=round<=3?pool.filter(p=>!has(p,'AVOID')&&p.adp>=pick-6&&p.adp<=pick+18):[];
  const seen=new Map();
  for(const p of [...flagged,...early])if(av(p)>=.12)seen.set(p.name,p);
  const targets=[...seen.values()].sort(round<=3
    ?(a,b)=>vor(b)-vor(a)||av(b)-av(a)
    :(a,b)=>av(b)*cl(b)-av(a)*cl(a)||vor(b)-vor(a)).slice(0,MAX_TARGETS);
  // only traps that will actually be tempting here: priced at your pick, and
  // likely enough to still be sitting there when you look
  const avoids=pool.filter(p=>has(p,'AVOID')&&Math.abs(mkt(p)-pick)<=14&&av(p)>=.25)
    .sort((a,b)=>av(b)-av(a)).slice(0,MAX_AVOIDS);
  return {targets,avoids};
}
function caseHtml(p){
  const pr=PROFILES[p.name],list=(cls,g,xs)=>`<ul class="${cls}">${(xs||[]).map(x=>`<li><span class="g" aria-hidden="true">${g}</span><span>${esc(x)}</span></li>`).join('')}</ul>`;
  const guide=pr.stance?`Guide: ${pr.stance} ${pr.cl}/10`:'';
  return `<div class="pcase">${pr.situation?`<p class="psit">${esc(pr.situation)}</p>`:''}<div class="pc">${list('pro','+',pr.pros)}${list('con','&ndash;',pr.cons)}</div><div class="pfoot">${pr.bottom_line?`<span><b>Bottom line:</b> ${esc(pr.bottom_line)}</span>`:''}${guide?`<span class="chip${pr.stance==='avoid'?' q':''}">${esc(guide)}</span>`:''}<span class="chip q">${p.adp?`Mkt: R${Math.ceil(p.adp/TEAMS)}`:'Mkt: undrafted'}</span>${pr.note?`<span>${esc(pr.note)}</span>`:''}</div></div>`;
}
function rowHtml(p,pick){
  const v=pct5(pAvail(p.adp,pick)),on=Math.round(v/10);
  const meter=Array.from({length:10},(_,i)=>`<i${i<on?' class="on"':''}></i>`).join('');
  return `<details class="prow"><summary><span class="chev" aria-hidden="true">&#9656;</span><span class="pname">${esc(p.name)} <em>${esc(p.pos)}&middot;${esc(p.team||'FA')}</em></span><span class="pmeter"><span class="meter" aria-hidden="true">${meter}</span><b class="pct">${v}%</b><i class="chip">${stampFor(p.adp,v)}</i></span></summary>${caseHtml(p)}</details>`;
}
const rowsHtml=(label,ps,pick,cls)=>ps.length?`<section class="rows ${cls}"><h4 class="row-label">${label}</h4>${ps.map(p=>rowHtml(p,pick)).join('')}</section>`:'';
function brain(){
  const oddGap=2*(TEAMS-seat),evenGap=2*(seat-1),plans=Array.from({length:ROUNDS},(_,i)=>planFor(i+1));
  // underline only the boundaries the drills actually teach -- a forced 6-player
  // cut is not a panic trigger, and marking it trains a reflex on noise
  const tierHtml=POSITIONS.map(pos=>{const all=TIERS[pos],ts=all.filter(t=>t.tier!=='late'),late=all.find(t=>t.tier==='late');
    return `<section class="position"><h3>${pos}<small>${all.reduce((n,t)=>n+t.players.length,0)} names</small></h3>${all.map(t=>{const i=ts.indexOf(t),real=t.tier!=='late'&&bandOf(t)!=='C'&&isCliff(pos,t,ts[i+1]||late);
      return `<div class="tier-row"><span class="tier-no">${t.tier==='late'?'LATE':`T${t.tier}`}</span><span>${t.players.map((p,j)=>playerHtml(p,real&&j===t.players.length-1)).join('')}</span></div>`}).join('')}</section>`}).join('');
  return `<section id="brain">
    <header class="view-head"><div><h1>Memorize the cliffs.</h1><p>The underlined final name in every tier is your panic trigger. Hooks turn traits into recall cues.</p></div><div class="stamp">Seat ${seat}<br>${TEAMS} teams / standard / ${ROUNDS} rounds</div></header>
    <div class="brain-top"><div class="snake"><div class="gap-stat"><strong>${oddGap}</strong><span>picks happen after your odd-round pick</span></div><div class="gap-stat"><strong>${evenGap}</strong><span>picks happen after your even-round pick</span></div></div><section class="strategy"><h2 class="section-label">Five rules</h2><ol>${strategyRules().map(x=>`<li>${esc(x)}</li>`).join('')}</ol></section></div>
    <div class="pick-strip">${plans.map((p,i)=>`<div class="pick"><b>R${i+1} / ${esc(pickLabel(i+1))}</b><span>#${p.pick}</span></div>`).join('')}</div>
    <div class="tiers-head"><h2>Position tiers</h2><div class="legend"><span class="cliff-key">underlined = tier cliff</span> / LATE = rounds 11+ pool / cut at ECR ${CUTOFF}</div></div>
    <div class="tier-board">${tierHtml}</div>
    <div class="plan-head"><h2>Your 14-pick plan</h2><div class="legend">% = chance he's still on the board at your pick, from ADP. Tap a name for the case.</div></div>
    <div class="round-plan">${plans.map((p,i)=>{
      const round=i+1,rows=planRows(p.pick,round);
      return `<article class="round"><div class="round-key"><strong>#${p.pick}</strong><span>${esc(pickLabel(round))} / Round ${round}</span></div><p class="round-body"><b>Plan:</b> ${esc(p.plan.replace('Best available: ','').replace('Best late upside: ',''))} <b>Fallback:</b> ${esc(p.fallback)}</p>${round>=12?'<p class="round-note">K/DST only in the last two rounds.</p>':''}${rowsHtml('Target',rows.targets,p.pick,'target')}${rowsHtml('Avoid',rows.avoids,p.pick,'avoid')}</article>`
    }).join('')}</div>
  </section>`;
}

function hash(s){let h=2166136261;for(let i=0;i<s.length;i++)h=Math.imul(h^s.charCodeAt(i),16777619);return(h>>>0).toString(36)}
// The id is hashed from `key`, NOT from the rendered text, so that a tier
// renumbering above a card does not orphan its Leitner box. Keys carry the
// fact being learned; when the fact changes outright the card resets, but a
// fact that merely gained/lost a name keeps its box via migrate() below.
function card(type,question,answer,key){return {type,question,answer,key,id:hash(key)}}
function cards(){
  const out=[];CLIFF.clear();
  const cliff=c=>{CLIFF.add(c.id);return c};
  POSITIONS.forEach(pos=>{
    const ts=TIERS[pos].filter(t=>t.tier!=='late'), late=TIERS[pos].find(t=>t.tier==='late');
    ts.forEach((t,i)=>{
      if(bandOf(t)==='C')return; // rounds 8+: the plan cards carry these picks, not names
      const names=t.players.map(p=>p.name).join(', '),last=t.players.at(-1);
      const real=isCliff(pos,t,ts[i+1]||late);
      // key names are SORTED so pure reordering inside a tier never resets the card
      const recall=card('Tier recall',`Name the tier-${t.tier} ${pos}${t.players.length>1?'s':''}.`,names,`recall|${pos}|${t.players.map(p=>p.name).sort().join(', ')}`);
      out.push(t.players.length===1&&real?cliff(recall):recall); // a one-man tier IS its cliff
      if(real&&t.players.length>1)out.push(cliff(card('Boundary',`Who is the LAST ${pos} in tier ${t.tier}?`,`${last.name}. That is the tier cliff.`,`cliff|${pos}|${last.name}`)));
    });
    // same-position pairs only across a REAL tier boundary: inside a tier, order is noise
    ts.forEach((t,i)=>{
      const next=ts[i+1];
      if(!next||bandOf(next)==='C'||!isCliff(pos,t,next))return;
      const a=t.players.at(-1),b=next.players[0];
      out.push(card('Who goes earlier?',`${a.name} or ${b.name}?`,`${a.name} — he is the tier-${t.tier} cliff; ${b.name} opens tier ${next.tier}.`,`pair|${a.name}|${b.name}`));
    });
  });
  draftable.filter(p=>p.ecr<=BAND_B_END&&hookText(p)).forEach(p=>out.push(card('Hook recall',`What's the hook on ${p.name}?`,hookText(p),`hook|${p.name}|${hookText(p)}`)));
  for(let round=1;round<=ROUNDS;round++){
    const p=planFor(round);
    out.push(card('Plan recall',`Your pick ${pickLabel(round)}: what's the plan?`,`${p.plan}. Fallback: ${p.fallback}.`,`plan|${round}|${p.plan}`));
  }
  return out;
}
let deck=[],queue=[],state,open=null,lapsed=new Set();const CLIFF=new Set();
// A session is explicit: it opens when the user presses Start and closes at the
// summary (finished or ended early). The queue persists after every answer, so
// a reload, tab kill, or days-later return lands back in the same session. An
// open session idle past STALE greets you with the gate instead of a stray card.
const STALE=8*36e5;
const ago=t=>{const m=Math.round((Date.now()-t)/6e4);return m<1?'just now':m<60?`${m}m ago`:m<1440?`${Math.round(m/60)}h ago`:`${Math.round(m/1440)}d ago`};
// --- refresh-proof progress: a data refresh recuts tiers, changing card keys/ids.
// 'study-meta' remembers each known id's {type,key}; on load, a new card with no
// box inherits from an orphaned old card of the same type whose fact (name-set,
// same position) overlaps >=50% (Jaccard). Genuinely new facts still start at
// box 1. LEGACY_META bootstraps users from before 'study-meta' existed.
const LEGACY_META=__LEGACY_META__;
function keyFacts(type,key){
  const s=key.split('|');
  if(s[0]==='recall')return{pos:s[1],names:s[2].split(', ')};
  if(s[0]==='cliff')return{pos:s[1],names:[s[2]]};
  if(s[0]==='pair')return{pos:'',names:s.slice(1)};
  if(s[0]==='hook')return{pos:'',names:[s[1]]};
  return null; // plan cards: seat/round-bound, never migrated
}
function jaccard(a,b){const B=new Set(b),i=a.filter(x=>B.has(x)).length;return i/(a.length+b.length-i)}
function migrate(deck,state,meta){
  const live=new Set(deck.map(c=>c.id));
  const orphans=Object.keys(state.boxes).filter(id=>!live.has(id)&&meta[id]);
  for(const c of deck){
    if(state.boxes[c.id])continue;
    const f=keyFacts(c.type,c.key);if(!f)continue;
    let best=null,score=0.5;
    for(const id of orphans){
      const o=meta[id];if(o.type!==c.type)continue;
      const of=keyFacts(o.type,o.key);if(!of||of.pos!==f.pos)continue;
      const s=jaccard(f.names,of.names);
      if(s>=score){score=s;best=id}
    }
    if(best){state.boxes[c.id]=state.boxes[best];delete state.boxes[best];orphans.splice(orphans.indexOf(best),1)}
  }
  const next={};deck.forEach(c=>next[c.id]={type:c.type,key:c.key});
  for(const id of Object.keys(state.boxes))if(!next[id]&&meta[id])next[id]=meta[id]; // keep orphan meta so chains survive multiple refreshes
  return next;
}
function loadDeck(){
  deck=cards();state=read('study-leitner',{session:0,boxes:{}});
  write('study-meta',migrate(deck,state,read('study-meta',null)||LEGACY_META||{}));
  deck.forEach(c=>{if(!state.boxes[c.id])state.boxes[c.id]=1});write('study-leitner',state);
  open=read('study-open',null);
}
// cliffs are exempt from spacing: every session sweeps ALL of them first
function dueFor(n){return deck.filter(c=>CLIFF.has(c.id)||state.boxes[c.id]===1||(state.boxes[c.id]===2&&n%2===0)||(state.boxes[c.id]===3&&n%4===0))}
function order(cs){
  const prio={'Boundary':0,'Tier recall':1,'Who goes earlier?':2,'Plan recall':3,'Hook recall':4};
  return cs.slice().sort((a,b)=>(CLIFF.has(b.id)-CLIFF.has(a.id))||prio[a.type]-prio[b.type]||hash(a.id+state.session).localeCompare(hash(b.id+state.session)));
}
function saveOpen(){if(open)write('study-open',open);else{try{localStorage.removeItem('study-open')}catch{}}}
function beginSession(){
  state.session++;write('study-leitner',state);
  queue=order(dueFor(state.session));lapsed=new Set();
  open={session:state.session,started:Date.now(),last:Date.now(),got:0,missed:0,ids:queue.map(c=>c.id),lapsed:[]};
  saveOpen();renderDrill();
}
function resumeSession(){
  const byId=new Map(deck.map(c=>[c.id,c])); // a data refresh may have retired cards; they drop out here
  queue=open.ids.map(id=>byId.get(id)).filter(Boolean);lapsed=new Set(open.lapsed);
  open.last=Date.now();saveOpen();renderDrill();
}
function progress(){const counts=[1,2,3].map(box=>deck.filter(c=>state.boxes[c.id]===box).length);return {counts,mastered:counts[2],total:deck.length}}
function renderGate(){
  const p=progress();
  if(open){
    $('#view').innerHTML=`<section class="drills"><header class="drill-head"><h1>Session ${open.session} is open.</h1><div class="progress"><span>started ${ago(open.started)}</span><span><strong>${open.got+open.missed}</strong> answered</span><span><strong>${p.mastered}/${p.total}</strong> in box 3</span></div></header><article class="flashcard"><div class="card-meta"><span>Session ${open.session}</span><span>In progress</span></div><div class="prompt"><div class="ticket-stat"><strong>${open.ids.length}</strong><span>cards left in this session</span></div></div><div class="card-actions"><button class="finish">End session</button><button class="resume got">Resume</button></div></article></section>`;
    $('.resume').onclick=resumeSession;$('.finish').onclick=()=>renderSummary();
  }else{
    $('#view').innerHTML=`<section class="drills"><header class="drill-head"><h1>Ready to drill.</h1><div class="progress"><span><strong>${p.mastered}/${p.total}</strong> in box 3</span><span>Box 1 / 2 / 3: ${p.counts.join(' / ')}</span><span>${CLIFF.size} cliffs sweep every session</span></div></header><article class="flashcard"><div class="card-meta"><span>Session ${state.session+1}</span><span>Due now</span></div><div class="prompt"><div class="ticket-stat"><strong>${dueFor(state.session+1).length}</strong><span>cards due this session</span></div></div><div class="card-actions"><button class="reveal begin">Start session</button></div></article></section>`;
    $('.begin').onclick=beginSession;
  }
}
function renderSummary(){
  const s=open,left=s.ids.length;open=null;saveOpen();queue=[];lapsed=new Set();
  const p=progress();
  $('#view').innerHTML=`<section class="drills"><header class="drill-head"><h1>Session ${s.session} ${left?'ended':'complete'}.</h1><div class="progress"><span><strong>${s.got}</strong> got</span><span><strong>${s.missed}</strong> missed</span><span><strong>${p.mastered}/${p.total}</strong> in box 3</span></div></header><div class="session-done"><div><h2>${left?`${left} cards return next session.`:'Good work.'}</h2><button id="again">Start session ${state.session+1}</button><div class="hint">Progress saves after every card.</div></div></div></section>`;
  $('#again').onclick=beginSession;
}
function renderDrill(){
  if(!queue.length)return renderSummary();
  const p=progress(),c=queue[0],relearning=queue.filter(x=>lapsed.has(x.id)).length;
  $('#view').innerHTML=`<section class="drills"><header class="drill-head"><h1>Recall before reveal.</h1><div class="progress"><span>Session ${open.session}</span><span><strong>${queue.length}</strong> left${relearning?` · ${relearning} relearning`:''}</span><span><strong>${p.mastered}/${p.total}</strong> in box 3</span><button class="end-session">End session</button></div></header><article class="flashcard"><div class="card-meta"><span>${esc(c.type)}</span><span>Box ${state.boxes[c.id]}</span></div><div class="prompt"><div><h2>${esc(c.question)}</h2><div class="answer" aria-live="polite">${esc(c.answer)}</div></div></div><div class="card-actions"><button class="reveal">Reveal answer</button><button class="score missed">Missed</button><button class="score got">Got it</button></div></article><div class="hint">Keyboard: space reveals / 1 missed / 2 got it / esc ends session</div></section>`;
  $('.reveal').onclick=reveal;$('.missed').onclick=()=>score(false);$('.got').onclick=()=>score(true);$('.end-session').onclick=()=>renderSummary();
}
function reveal(){$('.flashcard')?.classList.add('revealed')}
function score(got){
  const c=queue.shift();
  if(got){open.got++;if(!lapsed.has(c.id))state.boxes[c.id]=Math.min(3,state.boxes[c.id]+1)}
  else{open.missed++;state.boxes[c.id]=1;lapsed.add(c.id);queue.splice(Math.min(5,queue.length),0,c)}
  write('study-leitner',state);
  open.ids=queue.map(x=>x.id);open.lapsed=[...lapsed];open.last=Date.now();saveOpen();
  renderDrill();
}
function show(next){
  view=next;location.hash=next==='drills'?'drills':'';$$('.tab').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.view===next)));
  if(next==='brain'){$('#view').innerHTML=brain();return}
  if(open&&queue.length){renderDrill();return} // live mid-session: pick up the same card
  loadDeck();renderGate();
}
function init(){
  const select=$('#seat');select.innerHTML=Array.from({length:TEAMS},(_,i)=>`<option value="${i+1}">${i+1}</option>`).join('');select.value=seat;
  select.onchange=()=>{seat=+select.value;write('study-seat',seat);
    if(view==='brain'){$('#view').innerHTML=brain();return}
    loadDeck(); // plan cards are seat-specific, so the deck must rebuild
    if(open&&queue.length){const has=new Set(deck.map(c=>c.id));queue=queue.filter(x=>has.has(x.id));open.ids=queue.map(x=>x.id);saveOpen();renderDrill()}
    else renderGate();
  };
  $$('.tab').forEach(b=>b.onclick=()=>show(b.dataset.view));$('#print').onclick=()=>{if(view!=='brain')show('brain');setTimeout(()=>print(),0)};
  show(view);
}
document.addEventListener('keydown',e=>{if(view!=='drills'||/SELECT|INPUT/.test(document.activeElement?.tagName))return;if(e.code==='Space'&&queue.length){e.preventDefault();reveal()}if(e.key==='1'&&$('.flashcard.revealed'))score(false);if(e.key==='2'&&$('.flashcard.revealed'))score(true);if(e.key==='Escape'&&open&&queue.length)renderSummary()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&view==='drills'&&open&&queue.length&&Date.now()-open.last>STALE){queue=[];renderGate()}});
init();
</script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('../sw.js').catch(function(){});});}
